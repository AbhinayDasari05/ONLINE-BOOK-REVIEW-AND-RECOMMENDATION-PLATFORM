name: Secure CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    name: Build, Test, and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests (Pytest)
        run: |
          pytest -v --junitxml=pytest-results.xml

      - name: Run Static Application Security Testing (Bandit SAST)
        run: |
          bandit -r app/ -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Validate Container Definition
        run: |
          test -f docker/Dockerfile
          grep -q "USER 10001:10001" docker/Dockerfile
          echo "Dockerfile adheres to non-root execution policy"

      - name: Validate Kubernetes Manifests
        run: |
          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          grep -q "runAsNonRoot: true" k8s/deployment.yaml
          echo "Kubernetes deployment enforces runAsNonRoot policy"
