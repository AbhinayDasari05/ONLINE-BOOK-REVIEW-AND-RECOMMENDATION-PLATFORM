{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 2.5rem 1.5rem;">
  <h1 style="color: var(--secondary); font-size: 3rem; margin-bottom: 0.5rem;">404</h1>
  <h3 style="margin-bottom: 1rem;">Resource Not Found</h3>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    The requested book, review, or page does not exist on this server.
  </p>
  <a href="{{ url_for('catalog.index') }}" class="btn btn-primary">Return to Catalog</a>
</div>
{% endblock %}
