{% extends "base.html" %}
{% block title %}500 - Internal Server Error{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 2.5rem 1.5rem; border-top: 4px solid var(--danger);">
  <h1 style="color: var(--danger); font-size: 3rem; margin-bottom: 0.5rem;">500</h1>
  <h3 style="margin-bottom: 1rem;">Internal Server Error</h3>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    An internal error occurred. For security reasons, detailed system stack traces and database errors are withheld (CTRL-07, RULE I).
  </p>
  <a href="{{ url_for('catalog.index') }}" class="btn btn-primary">Return to Catalog</a>
</div>
{% endblock %}
