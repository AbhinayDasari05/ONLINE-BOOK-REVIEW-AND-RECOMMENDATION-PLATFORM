{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 2.5rem 1.5rem; border-top: 4px solid var(--danger);">
  <h1 style="color: var(--danger); font-size: 3rem; margin-bottom: 0.5rem;">403</h1>
  <h3 style="margin-bottom: 1rem;">Access Forbidden</h3>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    Access denied. You do not possess the required authorization credentials or permissions to view or mutate this resource (CTRL-02, CTRL-06).
  </p>
  <a href="{{ url_for('catalog.index') }}" class="btn btn-primary">Return to Catalog</a>
</div>
{% endblock %}
