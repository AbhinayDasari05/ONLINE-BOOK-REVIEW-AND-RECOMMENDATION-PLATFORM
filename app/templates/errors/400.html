{% extends "base.html" %}
{% block title %}400 - Bad Request{% endblock %}
{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 3rem auto; padding: 2.5rem 1.5rem;">
  <h1 style="color: var(--warning); font-size: 3rem; margin-bottom: 0.5rem;">400</h1>
  <h3 style="margin-bottom: 1rem;">Bad Request</h3>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
    The server could not understand the request due to invalid or malformed data syntax.
  </p>
  <a href="{{ url_for('catalog.index') }}" class="btn btn-primary">Return to Catalog</a>
</div>
{% endblock %}
