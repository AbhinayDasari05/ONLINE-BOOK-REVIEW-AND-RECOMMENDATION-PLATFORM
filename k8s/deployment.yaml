apiVersion: v1
kind: ConfigMap
metadata:
  name: bookplatform-config
  namespace: bookplatform
data:
  FLASK_ENV: "production"
  SESSION_COOKIE_SECURE: "false"
  PERMANENT_SESSION_LIFETIME_SECONDS: "3600"
---
apiVersion: v1
kind: Secret
metadata:
  name: bookplatform-secret
  namespace: bookplatform
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-very-secure-random-key-in-production-cluster"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookplatform-app
  namespace: bookplatform
  labels:
    app: bookplatform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookplatform
  template:
    metadata:
      labels:
        app: bookplatform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: secure-book-review-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: bookplatform-config
            - secretRef:
                name: bookplatform-secret
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: bookplatform-service
  namespace: bookplatform
spec:
  type: ClusterIP
  selector:
    app: bookplatform
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
